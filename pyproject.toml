[project]
name = "dark-factory-os"
version = "0.1.0"
description = "Governed agentic operations platform for enterprise workflows"
requires-python = ">=3.12"
dependencies = [
  "dark-factory-api",
  "dark-factory-artifacts",
  "dark-factory-evals",
  "dark-factory-governance",
  "dark-factory-memory",
  "dark-factory-orchestration",
  "dark-factory-persistence",
  "dark-factory-skills-registry",
  "dark-factory-tool-adapters",
  "dark-factory-worker",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
  "types-PyYAML>=6.0.12.20240917"
]

[tool.uv.sources]
dark-factory-api = { workspace = true }
dark-factory-artifacts = { workspace = true }
dark-factory-evals = { workspace = true }
dark-factory-governance = { workspace = true }
dark-factory-memory = { workspace = true }
dark-factory-orchestration = { workspace = true }
dark-factory-persistence = { workspace = true }
dark-factory-skills-registry = { workspace = true }
dark-factory-tool-adapters = { workspace = true }
dark-factory-worker = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/py/*"]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps", "packages"]
