[project]
name = "dark-factory-os"
version = "0.1.0"
description = "Governed agentic operations platform for enterprise workflows"
requires-python = ">=3.12"
dependencies = ["dark-factory-api"]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4"
]

[tool.uv.sources]
dark-factory-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/py/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps", "packages"]
