[project]
name = "dark-factory-api"
version = "0.1.0"
description = "Dark Factory OS control-plane API"
requires-python = ">=3.12"
dependencies = [
  "dark-factory-evals",
  "dark-factory-memory",
  "dark-factory-orchestration",
  "dark-factory-persistence",
  "fastapi>=0.115.6",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "pydantic>=2.10.4",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4"
]

[tool.uv]
package = true

[tool.uv.sources]
dark-factory-evals = { workspace = true }
dark-factory-orchestration = { workspace = true }
dark-factory-memory = { workspace = true }
dark-factory-persistence = { workspace = true }
