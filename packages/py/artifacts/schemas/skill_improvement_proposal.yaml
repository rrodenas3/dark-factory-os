$schema: https://json-schema.org/draft/2020-12/schema
title: SkillImprovementProposal
type: object
required:
  - id
  - skill_name
  - trigger
  - proposed_change
  - evidence
  - diff_summary
  - eval_plan
  - status
  - created_at
properties:
  id:
    type: string
    description: Stable proposal identifier.
  skill_name:
    type: string
    description: Skill that should be improved.
  trigger:
    type: string
    description: Production trace pattern that caused the proposal.
  proposed_change:
    type: string
    description: Human-readable change request for the SKILL.md or supporting files.
  evidence:
    type: array
    minItems: 1
    items:
      type: string
    description: Trace, policy, or run evidence supporting the proposal.
  diff_summary:
    type: array
    minItems: 1
    items:
      type: string
    description: Expected edit summary before any file change is made.
  eval_report_attachment:
    type:
      - object
      - "null"
    description: CLEAR summary used to gate review readiness.
    properties:
      task_success_rate:
        type: number
      grounding_score:
        type: number
      trajectory_f1:
        type: number
      approval_precision:
        type: number
      avg_cost_usd:
        type: number
  eval_plan:
    type: array
    minItems: 1
    items:
      type: string
    description: Checks that must pass before accepting the skill update.
  status:
    type: string
    enum: [draft, evaluating, ready_for_review, rejected, accepted]
  created_at:
    type: string
    format: date-time
