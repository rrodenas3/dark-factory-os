[project]
name = "dark-factory-skills-registry"
version = "0.1.0"
description = "SKILL.md loader and validator"
requires-python = ">=3.12"
dependencies = ["dark-factory-governance", "pydantic>=2.10.4", "pyyaml>=6.0.2"]

[tool.uv.sources]
dark-factory-governance = { workspace = true }

[project.scripts]
dfos-validate-skills = "dark_factory_skills_registry.validate:main"

[tool.uv]
package = true
